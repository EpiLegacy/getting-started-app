# Development baseline: "docker compose up" alone must yield a working
# application, database and broker included.
#
# The "version:" key no longer exists in Compose v2 and is deliberately absent.

name: legacy-kanban

services:

  # -------------------------------------------------------------------------
  # MySQL
  # -------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
      MYSQL_DATABASE: ${MYSQL_DB:-todos}
      MYSQL_USER: ${MYSQL_USER:-todo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-todo_dev_password}

    ports:
      - "${MYSQL_PORT:-3306}:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "--silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # -------------------------------------------------------------------------
  # RabbitMQ
  # -------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}

    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # -------------------------------------------------------------------------
  # Drizzle migrations
  # -------------------------------------------------------------------------
  migration:
    build:
      context: .
      target: migration

    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER:-todo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-todo_dev_password}
      MYSQL_DB: ${MYSQL_DB:-todos}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 465
      SMTP_USER: bap.fouillet@gmail.com
      SMTP_PASS: gxthotbswphjqdqe

    depends_on:
      mysql:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # API
  # -------------------------------------------------------------------------
  api:
    build:
      context: .
      target: runtime

    restart: unless-stopped

    ports:
      - "${API_PORT:-3000}:3000"

    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER:-todo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-todo_dev_password}
      MYSQL_DB: ${MYSQL_DB:-todos}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 465
      SMTP_USER: bap.fouillet@gmail.com
      SMTP_PASS: gxthotbswphjqdqe

      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      # legacy|drizzle (ADR 0001). Unset here defaults to legacy in the app
      # itself; run `npm run db:migrate` against this database first if you
      # switch to drizzle — it never creates tables on its own.
      PERSISTENCE_DRIVER: ${PERSISTENCE_DRIVER:-legacy}
      # This stack serves plain HTTP, and a Secure session cookie is dropped
      # over HTTP by some browsers even on localhost. Any exposed deployment
      # serves HTTPS and leaves this unset, which keeps the cookie Secure.
      # /auth needs the users and sessions tables: `npm run db:migrate` first.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      migration:
        condition: service_completed_successfully

      rabbitmq:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # Notification worker
  # -------------------------------------------------------------------------
  worker:
    build:
      context: .
      target: runtime

    restart: unless-stopped

    command:
      [
        "node",
        "build/workers/notifications/index.js"
      ]

    # The runtime image healthcheck probes HTTP,
    # which the worker does not expose.
    healthcheck:
      disable: true

    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER:-todo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-todo_dev_password}
      MYSQL_DB: ${MYSQL_DB:-todos}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 465
      SMTP_USER: bap.fouillet@gmail.com
      SMTP_PASS: gxthotbswphjqdqe

      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672

      PERSISTENCE_DRIVER: ${PERSISTENCE_DRIVER:-drizzle}

    depends_on:
      migration:
        condition: service_completed_successfully

      rabbitmq:
        condition: service_healthy

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------

volumes:
  mysql-data:
  rabbitmq-data: