global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: kanban-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3000"]

  - job_name: kanban-worker
    static_configs:
      - targets: ["worker:9000"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  # Queue backlog, unacknowledged messages and consumer counts, including DLQ.
  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
      vhost: ["/"]
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: mysql
    static_configs:
      - targets: ["mysql-exporter:9104"]
