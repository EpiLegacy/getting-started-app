name: CI

on:
  pull_request:
    # "edited" re-runs the checks when the pull request title is corrected.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# One useful run per branch: superseded runs are cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    name: Commit convention
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint lints a range of commits: it needs the whole history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint the commits
        run: >
          npx commitlint
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"
          --verbose

      # The title becomes the commit message on a squash merge, so it has to
      # follow the convention too. It travels through an environment variable
      # and is never interpolated into the shell: it is free text.
      - name: Lint the pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --verbose

  typecheck:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # tsc --noEmit. The Vite bundler strips types without checking them, so
      # without this job nothing in the pipeline would ever read them.
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Look for a "lint" npm script
        id: script
        run: |
          if node -e "process.exit((require('./package.json').scripts || {}).lint ? 0 : 1)"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: npm run lint
        if: steps.script.outputs.present == 'true'
        run: npm run lint

      - name: No linter configured
        if: steps.script.outputs.present == 'false'
        run: |
          echo "::warning title=No linter::No \"lint\" script in package.json. This job turns blocking on its own as soon as one is added."

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

      # jest.config.cjs already collects coverage. Keeping the report makes it
      # reviewable, which condition 3 of the Definition of Done asks for.
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The two halves the Docker image ships, built the same way it builds
      # them: the backend compiled to build/, the frontend bundled to dist/.
      - name: Compile the backend
        run: npx tsc -p tsconfig.build.json

      - name: Bundle the frontend
        run: npm run build

      # Condition 6 of the Definition of Done asks for build artefacts.
      - name: Publish the build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artefacts
          path: |
            build/
            dist/
          if-no-files-found: error

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # sqlite3 has no prebuilt binary for Node 24 and compiles from source,
      # which costs about three minutes cold. The GitHub Actions cache brings
      # later runs down to seconds as long as the dependencies do not move.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: legacy-kanban:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building proves it compiles. Only starting it proves it runs.
      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 3000:3000 legacy-kanban:ci
          # --retry-connrefused alone is not enough: docker publishes the host
          # port as soon as the container starts, so a request sent before the
          # server listens is reset rather than refused, and curl treats a
          # reset as a non-retryable error unless --retry-all-errors is set.
          if ! curl -fsS --retry 20 --retry-delay 2 --retry-connrefused --retry-all-errors http://127.0.0.1:3000/items; then
            echo "::error title=Image unusable::The container did not answer on /items."
            docker logs smoke
            exit 1
          fi
          echo
          echo "Image answered on /items."

      - name: Container logs
        if: always()
        run: docker logs smoke 2>&1 || true

      - name: Stop the container
        if: always()
        run: docker rm -f smoke || true
