# The deployed stack. Unlike the development docker-compose.yml at the root,
# nothing here is built: every service runs a published image, the
# application at the exact version deploy.sh is asked for.
#
# Every credential is required (":?"): a missing value stops the deployment
# before anything starts, instead of silently falling back to a development
# password. They live in .env next to this file, on the server only.

name: legacy-kanban

x-database: &database
  MYSQL_HOST: mysql
  MYSQL_DB: ${MYSQL_DB:-todos}
  MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}

x-application: &application
  image: ${APP_IMAGE:-ghcr.io/epilegacy/getting-started-app}:${APP_VERSION:?deploy.sh sets APP_VERSION}
  restart: unless-stopped
  environment: &application-environment
    <<: *database
    RABBITMQ_URL: amqp://${RABBITMQ_USER:?set RABBITMQ_USER in .env}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq:5672
    # The target persistence of ADR 0001. The legacy driver only exists to
    # migrate old installs.
    PERSISTENCE_DRIVER: drizzle

services:

  # Terminates HTTPS in front of the API. With SITE_ADDRESS set to a domain
  # name, Caddy obtains and renews its certificate on its own; set to ":80",
  # it serves plain HTTP, which is only for rehearsals (see .env.example).
  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      api:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DB:-todos}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # No published port: only the services below reach the database.
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  rabbitmq:
    # No management plugin: its UI would be one more thing to expose.
    image: rabbitmq:4-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Runs once per deployment, from the image about to be started, and must
  # succeed before the new API and worker start.
  migration:
    <<: *application
    restart: "no"
    command: ["node", "build/scripts/migrate.js"]
    environment: *database
    depends_on:
      mysql:
        condition: service_healthy

  api:
    <<: *application
    # Not published on the host: the proxy is the only way in.
    environment:
      <<: *application-environment
      # Secure unless the rehearsal turns it off: over plain HTTP a browser
      # drops a Secure cookie and nobody could stay signed in.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    depends_on:
      migration:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  worker:
    <<: *application
    command: ["node", "build/workers/notifications/index.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 3
    depends_on:
      migration:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

volumes:
  caddy-data:
  mysql-data:
  rabbitmq-data:
